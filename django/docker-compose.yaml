# Pinned, because Compose would otherwise name the project after this directory ("django")
# and share volumes, networks and containers with the other repos whose Django app also
# lives in a "django/" folder.
name: dutch-learning

# Container names and the host Postgres port are likewise distinct from those projects',
# so this stack can run at the same time as them.
services:
  web:
    container_name: dutch_web
    build:
      context: ..
      dockerfile: django/Dockerfile
    command: ["bash", "entrypoint.sh", "dev"]
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      - DJANGO_SUPERUSER_USERNAME=admin
      - DJANGO_SUPERUSER_EMAIL=admin@localhost
      - DJANGO_SUPERUSER_PASSWORD=admin
      # "web" is needed as well, because the Streamlit container calls http://web:8000
      - ALLOWED_HOSTS=localhost,127.0.0.1,web
      - DATABASE_NAME=dutch_vocabulary
      - DATABASE_USER=postgres
      - DATABASE_PASSWORD=postgres
      - DATABASE_HOST=db
      - DATABASE_PORT=5432
      - LOAD_SAMPLE_DECK=True
    depends_on:
      db:
        condition: service_healthy
    networks:
      - dutch_network
    volumes:
      - ..:/app
      # Keeps the collectstatic output from the image, which the repo mount would hide.
      - static_data:/app/django/staticfiles
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health/')"]
      interval: 5s
      timeout: 5s
      retries: 20

  streamlit:
    container_name: dutch_streamlit
    build:
      context: ..
      dockerfile: django/Dockerfile
    command: ["bash", "entrypoint.sh", "streamlit"]
    ports:
      - "8501:8501"
    env_file:
      # The repo-root .env holds GOOGLE_API_KEY, used by the AI hint agent.
      - path: ../.env
        required: false
    environment:
      - VOCAB_API_URL=http://web:8000/api
    depends_on:
      web:
        condition: service_healthy
    networks:
      - dutch_network
    volumes:
      - ..:/app
      - static_data:/app/django/staticfiles

  db:
    container_name: dutch_postgres
    image: postgres:17.7
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: dutch_vocabulary
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    networks:
      - dutch_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pg_data:
  static_data:

networks:
  dutch_network:
