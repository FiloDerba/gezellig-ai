[project]
name = "ai-playground"
version = "0.1.0"
description = "Playground for testing agentic frameworks, primarily pydantic-ai"
readme = "README.md"
authors = [
    { email = "filippo.alberton95@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "altair>=5.5.0",
    "django>=6.1.1",
    "logfire>=4.40.0",
    "pandas>=2.3.0",
    "psycopg[binary]>=3.2.12",
    "pydantic-ai-slim[anthropic,google,openai]>=2.32.1",
    "python-dotenv>=1.2.3",
    "streamlit>=1.63.0",
    "tavily-python>=0.7.27",
]

[project.scripts]
ai-playground = "ai_playground:main"

[build-system]
requires = ["uv_build>=0.9.17,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-django>=4.14.0",
    "ruff>=0.16.3",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
# "vocabulary" and "backend" live under django/, not src/, so name them explicitly.
known-first-party = ["ai_playground", "dutch_learning", "backend", "vocabulary"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "django"]
pythonpath = ["src", "django"]
DJANGO_SETTINGS_MODULE = "backend.settings"
python_files = ["test_*.py"]
python_classes = ["Test*", "*Tests"]

[tool.pyright]
include = ["src", "tests"]
venvPath = "."
venv = ".venv"
