[project]
name = "ai-playground"
version = "0.1.0"
description = "Playground for testing agentic frameworks, primarily pydantic-ai"
readme = "README.md"
authors = [
    { email = "filippo.alberton95@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "logfire>=4.40.0",
    "pydantic-ai-slim[anthropic,google,openai]>=2.32.1",
    "python-dotenv>=1.2.3",
    "streamlit>=1.40.0",
    "tavily-python>=0.7.27",
]

[project.scripts]
ai-playground = "ai_playground:main"
dutch-learning = "dutch_learning.importer:main"

[build-system]
requires = ["uv_build>=0.9.17,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.3",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.pyright]
include = ["src", "tests"]
venvPath = "."
venv = ".venv"
